  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });

  if (!ts) return '-';
  var d = new Date(ts);

  var n = new Date();

  var el = document.getElementById(id);

  document.documentElement.setAttribute('data-theme', theme);

  if (m) m.setAttribute('content', theme === 'dark' ? '#0b1220' : '#0284c7');
  var b = document.getElementById('theme-toggle');
  if (b) b.innerHTML = theme === 'dark' ? '&#9728;' : '&#127769;';
}

  theme = theme === 'dark' ? 'light' : 'dark';

  applyTheme();
}

  var osTheme = matchMedia('(prefers-color-scheme: dark)');
  var onOsTheme = function (e) {

    if (!manual) { theme = e.matches ? 'dark' : 'light'; applyTheme(); }
  };
  if (osTheme.addEventListener) osTheme.addEventListener('change', onOsTheme);
  else if (osTheme.addListener) osTheme.addListener(onOsTheme);
}

async function api(action, body) {
  var res = await fetch('/api/' + action, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  var data = null;
  try { data = await res.json(); } catch (err) { data = null; }
  if (res.status === 401) {
    session = null;
    render();
    throw new Error((data && data.error) || 'Please sign in again.');
  }
  if (!data || !data.ok) throw new Error((data && data.error) || ('Request failed (HTTP ' + res.status + ')'));
  return data;
}
async function apiUpload(action, formData) {
  var res = await fetch('/api/' + action, { method: 'POST', body: formData });
  var d = null;
  try { d = await res.json(); } catch (err) { d = null; }
  if (!d || !d.ok) throw new Error((d && d.error) || ('Upload failed (HTTP ' + res.status + ')'));
  return d;
}

function table(headers, rows) {
  var html = '<div class="table-wrap"><table><thead><tr>';
  headers.forEach(function (h) { html += '<th scope="col">' + H(h) + '</th>'; });
  html += '</tr></thead><tbody>';
  if (!rows.length) {
    html += '<tr><td colspan="' + headers.length + '" class="muted">' + t('common.none') + '</td></tr>';
  } else {
    rows.forEach(function (r) {
      html += '<tr>';
      r.forEach(function (c) { html += '<td>' + (c === '' ? '&nbsp;' : c) + '</td>'; });
      html += '</tr>';
    });
  }
  return html + '</tbody></table></div>';
}

function paginate(items, page, per) {
  var pages = Math.max(1, Math.ceil(items.length / per));
  if (page < 1) page = 1;
  if (page > pages) page = pages;
  return { slice: items.slice((page - 1) * per, page * per), page: page, pages: pages, total: items.length };
}
function pagerHtml(key, p) {
  if (p.pages <= 1) return '<p class="muted" style="margin-top:6px">' + p.total + ' ' + t('common.results') + '</p>';
  var btn = function (page, label, disabled) {
    return '<button class="small" data-pg="' + key + '|' + page + '"' + (disabled ? ' disabled' : '') + '>' + label + '</button>';
  };
  return '<div class="pager" role="navigation" aria-label="Pagination">' +
    btn(1, '&laquo;', p.page <= 1) + ' ' +
    btn(p.page - 1, '&lsaquo; ' + t('common.prev'), p.page <= 1) + ' ' +
    '<span class="muted">' + t('common.page') + ' ' + p.page + ' ' + t('common.of') + ' ' + p.pages +
    ' &middot; ' + p.total + ' ' + t('common.results') + '</span> ' +
    btn(p.page + 1, t('common.next') + ' &rsaquo;', p.page >= p.pages) + ' ' +

}

function dayChart(days, series, label) {
  if (!days.length) return '<p class="muted">' + t('common.none') + '</p>';
  var max = 1;
  days.forEach(function (d) {
    series.forEach(function (s) { max = Math.max(max, +d[s.key] || 0); });
  });
  var html = '<div class="chart" role="img" aria-label="' + esc(label) + '">';
  days.forEach(function (d) {
    html += '<div class="day" title="' + esc(d.date) + '"><div class="bars">';
    series.forEach(function (s) {
      var v = +d[s.key] || 0;
      var h = Math.round(100 * v / max);
      html += '<div class="bar" style="height:' + Math.max(h, v > 0 ? 4 : 0) +
              '%;background:' + s.color + '" title="' + esc(s.name + ': ' + v) + '"></div>';
    });
    html += '</div><span>' + esc(String(d.date).slice(5)) + '</span></div>';
  });
  html += '</div><div class="legend">';
  series.forEach(function (s) {
    html += '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + '</span>';
  });
  return html + '</div>';
}

var captchaState = null;
async function prepareCaptcha() {
  captchaState = null;
  try {
    var d = await api('captcha', {});
    if (!d.enabled) return;
    var prefix = '0'.repeat(d.difficulty);
    for (var n = 0; n < 5000000; n++) {
      if ((await sha256hex(d.salt + ':' + n)).indexOf(prefix) === 0) {
        captchaState = { salt: d.salt, answer: n };
        break;
      }
    }
  } catch (e) { }
}
async function sha256hex(s) {
  if (window.crypto && crypto.subtle) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }
  return sha256js(s);
}
function sha256js(ascii) {

  var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var bytes = [];
  for (var i = 0; i < ascii.length; i++) {
    var c = ascii.charCodeAt(i);
    if (c < 0x80) bytes.push(c);
    else if (c < 0x800) bytes.push(0xc0 | (c >> 6), 0x80 | (c & 63));
    else bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
  }
  var bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (i = 7; i >= 0; i--) bytes.push((bitLen >>> (i * 8)) & 0xff);
  for (i = 0; i < bytes.length; i += 64) {
    var w = new Array(64), tt;
    for (tt = 0; tt < 16; tt++) w[tt] = (bytes[i + tt * 4] << 24) | (bytes[i + tt * 4 + 1] << 16) | (bytes[i + tt * 4 + 2] << 8) | bytes[i + tt * 4 + 3];
    for (tt = 16; tt < 64; tt++) {
      var s0 = rr(w[tt - 15], 7) ^ rr(w[tt - 15], 18) ^ (w[tt - 15] >>> 3);
      var s1 = rr(w[tt - 2], 17) ^ rr(w[tt - 2], 19) ^ (w[tt - 2] >>> 10);
      w[tt] = (w[tt - 16] + s0 + w[tt - 7] + s1) | 0;
    }
    var a = H[0], b2 = H[1], c2 = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for (tt = 0; tt < 64; tt++) {
      var S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25);
      var ch = (e & f) ^ (~e & g);
      var t1 = (h + S1 + ch + K[tt] + w[tt]) | 0;
      var S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22);
      var maj = (a & b2) ^ (a & c2) ^ (b2 & c2);
      var t2 = (S0 + maj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c2; c2 = b2; b2 = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b2) | 0; H[2] = (H[2] + c2) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  var out = '';
  for (i = 0; i < 8; i++) out += ('00000000' + (H[i] >>> 0).toString(16)).slice(-8);
  return out;
}

// ================= WebSocket client =================
var ws = null;
var serverInfo = { ws: -1 };
function wsOpen() { return ws && ws.readyState === 1; }
function wsSend(obj) { if (wsOpen()) { try { ws.send(JSON.stringify(obj)); } catch (e) {} } }
function wsConnect() {
  if (serverInfo.ws == null || serverInfo.ws === -1) return;
  var target = serverInfo.ws === 0 ? location.host : (location.hostname + ':' + serverInfo.ws);
  var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  try { ws = new WebSocket(proto + target + '/ws'); }
  catch (e) { ws = null; return; }
  ws.onopen = function () {
    if (chatState) wsSend({ action: 'sub', room: chatState.id });
    if (currentView === 'home') wsSend({ action: 'sub', room: 'stats' });
  };
  ws.onmessage = function (ev) {
    try {
      var m = JSON.parse(ev.data);
      if (m.type === 'msg' && chatState && m.message && m.message.appointmentId === chatState.id) {
        appendBubble(m.message);
        var log = document.getElementById('chat-log');
        if (log) log.scrollTop = log.scrollHeight;
      } else if (m.type === 'stats') {
        applyStats(m.stats);
        renderCharts(m.daily || []);
        var u = document.getElementById('stats-updated');
        if (u) u.textContent = t('home.auto') + ' ' + new Date().toLocaleTimeString();
      }
    } catch (e) { }
  };
  ws.onclose = function () { ws = null; setTimeout(wsConnect, 5000); };
}

// ================= chat modal =================
var chatState = null;
var chatReturnFocus = null;

function openChat(apptId, title) {
  closeChat();
  chatState = { id: apptId, cursor: 0 };
  chatReturnFocus = document.activeElement;
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'chat-overlay';
  overlay.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(t('a11y.chat')) + ': ' + esc(title || '') + '">' +
      '<div class="m-head"><span>&#128172; ' + esc(t('a11y.chat')) + ' &mdash; ' + esc(title || '') + '</span>' +
      '<button class="small" id="chat-close" style="margin-top:0" aria-label="' + t('common.close') + '">' + t('common.close') + '</button></div>' +
      '<div class="chat-log" id="chat-log" aria-live="polite"></div>' +
      '<div class="chat-input"><input id="chat-text" aria-label="' + esc(t('a11y.chat')) + '">' +
      '<button class="primary" id="chat-send" style="margin-top:0">' + t('common.send') + '</button></div>' +
    '</div>';
  document.body.appendChild(overlay);
  document.getElementById('chat-close').onclick = closeChat;
  document.getElementById('chat-send').onclick = sendChat;
  document.getElementById('chat-text').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') sendChat();
  });
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeChat(); });
  chatState.keyHandler = function (e) {
    if (e.key === 'Escape') { closeChat(); }
    else if (e.key === 'Tab') { trapFocus(e); }
  };
  document.addEventListener('keydown', chatState.keyHandler);
  wsSend({ action: 'sub', room: apptId });
  pollChat(true);
  chatState.timer = setInterval(function () { if (!wsOpen()) pollChat(false); }, 3000);
}

function closeChat() {
  if (chatState) {
    wsSend({ action: 'unsub', room: chatState.id });
    if (chatState.timer) clearInterval(chatState.timer);
    if (chatState.keyHandler) document.removeEventListener('keydown', chatState.keyHandler);
  }
  chatState = null;
  var o = document.getElementById('chat-overlay');
  if (o) o.remove();
  if (chatReturnFocus && chatReturnFocus.focus) { try { chatReturnFocus.focus(); } catch (err) { } }
  chatReturnFocus = null;
}

function trapFocus(e) {
  var modal = document.getElementById('chat-overlay');
  if (!modal) return;
  var f = modal.querySelectorAll('button, input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if (!f.length) return;
  var first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

async function pollChat(first) {
  if (!chatState) return;
  try {
    var d = await api('chat/messages', { appointmentId: chatState.id, after: chatState.cursor });
    chatState.cursor = d.cursor || chatState.cursor;
    var log = document.getElementById('chat-log');
    (d.items || []).forEach(function (m) { appendBubble(m); });
    if (log) log.scrollTop = log.scrollHeight;
    if (first) { var tEl = document.getElementById('chat-text'); if (tEl) tEl.focus(); }
    updateUnread();
  } catch (e) { }
}

function appendBubble(m) {
  var log = document.getElementById('chat-log');
  if (!log) return;
  var mine = session && m.senderRole === session.role;
  var div = document.createElement('div');
  div.className = 'bubble ' + (mine ? 'b-me' : 'b-them');
  div.innerHTML = '<b>' + esc(m.senderName) + '</b><br>' + esc(m.text) +
                  '<div class="b-time">' + fmt(m.sentAt) + '</div>';
  log.appendChild(div);
}

async function sendChat() {
  var input = document.getElementById('chat-text');
  if (!input || !chatState) return;
  var text = input.value.trim();
  if (!text) return;
  if (wsOpen()) { wsSend({ action: 'send', room: chatState.id, text: text }); input.value = ''; return; }
  try {
    await api('chat/send', { appointmentId: chatState.id, text: text });
    input.value = '';
    pollChat(false);
  } catch (e) { alert(e.message); }
}

  w.document.write(

      '<p><b>Patient:</b> ' + esc(a.patientName) + '</p>' +

            '<div><label for="rx-' + esc(a.id) + '">' + H('Prescription') + '</label><textarea id="rx-' + esc(a.id) + '" placeholder="Medicines, dosage, advice..."></textarea></div>' +
          '</div>' +
          '<button class="primary" data-complete="' + esc(a.id) + '">' + t('doc.completeRx') + '</button>' +
        '</div>';
      }).join('');
    }
    document.getElementById('d-pending').innerHTML = pendingHtml;

    document.getElementById('d-done').innerHTML = table(
      ['Patient', 'Slot', 'Symptoms', 'Completed on', 'Diagnosis', 'Prescription', 'Action'],
      done.map(function (a) {
        return [esc(a.patientName), esc(fmtDT(a.scheduledAt)), esc(a.symptoms), fmt(a.completedAt),
                esc(a.diagnosis), esc(a.prescription),
                '<button class="small" data-pdf="' + esc(a.id) + '">PDF</button>'];
      }));

    wire('data-complete', async function (el) {
      var id = el.getAttribute('data-complete');
      try {
        await api('doctor/consult', { appointmentId: id, diagnosis: val('dx-' + id), prescription: val('rx-' + id) });
        loadDoctorAppointments(); loadDoctorPayments(); loadActivity();
      } catch (e) { alert(e.message); }
    });
    wire('data-chat', function (el) { openChat(el.getAttribute('data-chat'), el.getAttribute('data-chat-title')); });
    wire('data-pdf', function (el) {
      window.open('/api/prescription/pdf?appointmentId=' + encodeURIComponent(el.getAttribute('data-pdf')), '_blank');
    });
    wire('data-reports', async function (el) {
      var parts = el.getAttribute('data-reports').split('|');
      var box = document.getElementById('repbox-' + parts[1]);
      if (!box) return;
      if (box.style.display !== 'none') { box.style.display = 'none'; return; }
      box.style.display = 'block';
      box.textContent = t('common.loading');
      try {
        var d = await api('reports/patient', { patientId: parts[0] });
        box.innerHTML = (d.items || []).length
          ? table(['Title', 'File', 'Uploaded', 'Action'],
              (d.items || []).map(function (r) {
                return [esc(r.title), esc(r.fileName), fmt(r.uploadedAt),
                        '<a href="' + r.url + '" target="_blank"><button class="small">' + t('common.open') + '</button></a>'];
              }))
          : '<p class="muted">' + t('common.none') + '</p>';
      } catch (e) { box.textContent = e.message; }
    });
    updateUnread();
  } catch (e) {
    var el = document.getElementById('d-pending');
    if (el) el.textContent = e.message;
  }
}

async function loadHospitalData() {
  try {
    var res = await api('hospital/beds', {});
    var pats = await api('patients', {});
    hospBeds = res.beds || [];
    bedPage = 1;
    var s = res.summary || {};

    var pills = '';
    Object.keys(s.byType || {}).forEach(function (ty) {
      pills += '<span class="pill">' + esc(ty) + ': ' + s.byType[ty].free + '/' + s.byType[ty].total + '</span>';
    });
    document.getElementById('h-sum').innerHTML =
      '<div class="grid cols">' +
        statBox(s.total, t('hos.totalBeds')) + statBox(s.free, t('hos.free')) + statBox(s.occupied, t('hos.occupied')) +
      '</div>' + (pills ? '<div style="margin-top:12px">' + pills + '</div>' : '');

    var free = hospBeds.filter(function (b) { return b.status === 'FREE'; });
    document.getElementById('h-bed').innerHTML = free.length
      ? free.map(function (b) {
          return '<option value="' + esc(b.id) + '">Bed ' + b.bedNo + ' (' + esc(b.type) +
                 (b.ward ? ', ' + esc(b.ward) : '') + ')</option>';
        }).join('')
      : '<option value="">' + t('hos.noFree') + '</option>';

    var patOpts = (pats.items || []).length
      ? pats.items.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.name) + ' (' + esc(p.id) + ')</option>'; }).join('')
      : '';
    document.getElementById('h-pat').innerHTML = patOpts || '<option value="">' + t('hos.noPatients') + '</option>';
    var dp = document.getElementById('dp-pat');
    if (dp) dp.innerHTML = patOpts || '<option value="">' + t('hos.noPatients') + '</option>';

    renderBedsByWard();
    loadBedRequestQueue();
  } catch (e) {
    var el = document.getElementById('h-beds');
    if (el) el.textContent = e.message;
  }
}

function renderBedsByWard() {
  var el = document.getElementById('h-beds');
  if (!el) return;
  var p = paginate(hospBeds, bedPage, 10);
  bedPage = p.page;
  var wards = {};
  p.slice.forEach(function (b) {
    var w = b.ward || 'General Ward';
    (wards[w] = wards[w] || []).push(b);
  });
  var html = '';
  Object.keys(wards).sort().forEach(function (w) {
    html += '<div class="wardtitle">' + esc(w) + ' &mdash; ' + wards[w].length + '</div>';
    html += table(['Bed', 'Type', 'Status', 'Patient', 'Admitted since', 'Action'],
      wards[w].map(function (b) {
        return [
          'Bed ' + b.bedNo, esc(b.type),
          b.status === 'FREE' ? '<span class="badge b-green">' + t('tb.free') + '</span>'
                              : '<span class="badge b-red">' + t('tb.occupied') + '</span>',
          esc(b.patientName || '-'), fmt(b.admittedAt),
          b.status === 'FREE' ? '' : '<button class="small danger" data-discharge="' + esc(b.id) + '">Discharge</button>'
        ];
      }));
  });
  if (!html) html = '<p class="muted">' + t('common.none') + '</p>';
  el.innerHTML = html + pagerHtml('beds', p);

  wire('data-discharge', async function (btn) {
    if (!confirm('Discharge this patient? A bill will be generated and equipment released.')) return;
    try {
      var r = await api('hospital/discharge', { bedId: btn.getAttribute('data-discharge') });
      var b = r.bill;
      alert('Bed ' + b.bedNo + ' discharged. Bill ' + b.id + ': ' + cur() + ' ' + b.amount +
            ' (' + ((b.lines || []).length) + ' charge item(s))' +
            (r.equipmentReleased > 0 ? ' | ' + r.equipmentReleased + ' equipment item(s) released and billed' : ''));
      loadHospitalData();
      loadHospitalBills();
      loadEquipment();
      loadActivity();
    } catch (e) { alert(e.message); }
  });
}

async function loadBedRequestQueue() {
  var el = document.getElementById('h-reqs');
  if (!el) return;
  try {
    var d = await api('bed/requests', {});
    el.innerHTML = table(['Patient', 'Preferred type', 'Reason', 'Requested on', 'Status', 'Action'],
      (d.items || []).map(function (r) {
        var cell = '';
        if (r.status === 'PENDING') {
          var matching = hospBeds.filter(function (b) {
            return b.status === 'FREE' && (r.bedType === 'ANY' || b.type === r.bedType);
          });
          cell = (matching.length
            ? '<select id="brqbed-' + esc(r.id) + '">' +
              matching.map(function (b) {
                return '<option value="' + esc(b.id) + '">Bed ' + b.bedNo + ' (' + esc(b.type) +
                       (b.ward ? ', ' + esc(b.ward) : '') + ')</option>';
              }).join('') + '</select><br>'
            : '') +
            '<button class="small" data-approve="' + esc(r.id) + '">' + t('hos.approve') + '</button> ' +
            '<button class="small danger" data-reject="' + esc(r.id) + '">' + t('hos.reject') + '</button>';
        } else if (r.status === 'APPROVED') {
          cell = 'Bed ' + r.bedNo + (r.decisionNote ? '<br><span class="muted">' + esc(r.decisionNote) + '</span>' : '');
        } else if (r.status === 'REJECTED') {
          cell = r.decisionNote ? esc(r.decisionNote) : t('tb.rejected');
        } else {
          cell = '<span class="muted">' + t('tb.cancelled') + '</span>';
        }
        return [
          esc(r.patientName) + '<br><span class="muted">' + esc(r.patientAge) + ', ' + esc(r.patientPhone) + '</span>',
          esc(r.bedType), esc(r.reason || '-'), fmt(r.createdAt), reqBadge(r.status), cell
        ];
      }));
    wire('data-approve', async function (btn) {
      var id = btn.getAttribute('data-approve');
      try {
        var r = await api('bed/request/decide', { requestId: id, approve: true, bedId: val('brqbed-' + id) });
        alert('Bed ' + r.bedNo);
        loadBedRequestQueue(); loadHospitalData(); loadActivity();
      } catch (e) { alert(e.message); }
    });
    wire('data-reject', async function (btn) {
      var note = prompt('Reason for rejection (shown to the patient):', 'No beds available right now.');
      if (note === null) return;
      try {
        await api('bed/request/decide', { requestId: btn.getAttribute('data-reject'), approve: false, note: note });
        loadBedRequestQueue(); loadActivity();
      } catch (e) { alert(e.message); }
    });
  } catch (e) { el.textContent = e.message; }
}

async function loadEquipment() {
  var el = document.getElementById('h-eq');
  if (!el) return;
  try {
    var d = await api('equipment/list', {});
    var items = d.items || [];
    var bedsRes = await api('hospital/beds', {});
    var occupied = (bedsRes.beds || []).filter(function (b) { return b.status === 'OCCUPIED'; });

    el.innerHTML = table(['Label', 'Kind', 'Status', 'Attached to', 'Actions'],
      items.map(function (x) {
        var actions = '';
        if (x.status === 'AVAILABLE') {
          if (occupied.length) {
            actions = '<select id="eq-bed-' + esc(x.id) + '">' +
              occupied.map(function (b) {
                return '<option value="' + esc(b.id) + '">Bed ' + b.bedNo + ' (' + esc(b.type) + ')</option>';
              }).join('') + '</select><br>' +
              '<button class="small" data-assign="' + esc(x.id) + '">' + t('hos.eq.attach') + '</button><br>';
          }
          actions += '<button class="small danger" data-maint="' + esc(x.id) + '">' + t('hos.eq.maint') + '</button>';
        } else if (x.status === 'IN_USE') {
          actions = '<button class="small" data-release="' + esc(x.id) + '">' + t('hos.eq.release') + '</button>';
        } else {
          actions = '<button class="small" data-avail="' + esc(x.id) + '">' + t('hos.eq.back') + '</button>';
        }
        return [esc(x.label), esc(x.kind),
          x.status === 'AVAILABLE' ? '<span class="badge b-green">' + t('tb.eqAvailable') + '</span>'
          : x.status === 'IN_USE' ? '<span class="badge b-amber">' + t('tb.inUse') + '</span>'
          : '<span class="badge b-red">' + t('tb.maintenance') + '</span>',
          x.bedNo ? 'Bed ' + x.bedNo : '-', actions];
      }));

    wire('data-assign', async function (btn) {
      var id = btn.getAttribute('data-assign');
      try {
        await api('equipment/assign', { equipmentId: id, bedId: val('eq-bed-' + id) });
        loadEquipment(); loadActivity();
      } catch (e) { alert(e.message); }
    });
    wire('data-release', async function (btn) {
      try { await api('equipment/release', { equipmentId: btn.getAttribute('data-release') }); loadEquipment(); loadActivity(); }
      catch (e) { alert(e.message); }
    });
    wire('data-maint', async function (btn) {
      try { await api('equipment/status', { equipmentId: btn.getAttribute('data-maint'), status: 'MAINTENANCE' }); loadEquipment(); loadActivity(); }
      catch (e) { alert(e.message); }
    });
    wire('data-avail', async function (btn) {
      try { await api('equipment/status', { equipmentId: btn.getAttribute('data-avail'), status: 'AVAILABLE' }); loadEquipment(); loadActivity(); }
      catch (e) { alert(e.message); }
    });
  } catch (e) { el.textContent = e.message; }
}

      ['When', 'Actor', 'Action', 'Details'],
      (d.items || []).map(function (e) {
        return [fmt(e.ts), esc((e.actorRole || '-') + ' ' + (e.actorName || '')), actionBadge(e.action), esc(e.details || '')];
      }));
  } catch (e) {
    var el = document.getElementById('ad-audit');
    if (el) el.textContent = e.message;
  }
}

// ================= activity card =================
async function loadActivity() {
  var el = document.getElementById('act');
  if (!el) return;
  try {
    var d = await api('audit/mine');
    el.innerHTML = table(['When', 'Action', 'Details'], (d.items || []).map(function (e) {
      return [fmt(e.ts), actionBadge(e.action), esc(e.details || '')];
    }));
  } catch (e) {
    el.textContent = e.message;
  }
}

// ================= boot =================
(async function boot() {
  document.documentElement.lang = lang;
  document.getElementById('skip').textContent = t('a11y.skip');
  try {
    var d = await api('me');
    setSession(d && d.user);
    serverInfo.ws = (d && d.ws !== undefined && d.ws !== null) ? d.ws : -1;
  } catch (e) {
    session = null;
    serverInfo.ws = -1;
  }
  updateNet();
  window.addEventListener('online', updateNet);
  window.addEventListener('offline', updateNet);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function () { });
  }
  wsConnect();
  render();
})();
</script>
</body>
</html>
